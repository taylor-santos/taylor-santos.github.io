<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideman Alternative Vote</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; margin-top: 2rem; } h3 { font-size: 1rem; }
  label { display: block; margin: 1rem 0 .25rem; }
  input, textarea, button { font: inherit; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: .4rem; border: 1px solid #999; border-radius: 3px; }
  textarea { min-height: 8rem; }
  button { padding: .4rem .9rem; border: 1px solid #666; border-radius: 3px; background: #f4f4f4; cursor: pointer; }
  button.primary { background: #2a63c9; color: #fff; border-color: #2a63c9; margin-top: 1rem; }
  button.small { padding: 0 .4rem; margin-left: .25rem; }
  ol, ul { padding-left: 1.5rem; }
  #pool { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  #ranked li, #pool li { margin: .25rem 0; }
  table { border-collapse: collapse; margin: .5rem 0; }
  th, td { border: 1px solid #ccc; padding: .25rem .6rem; text-align: left; vertical-align: top; }
  th.rot { writing-mode: vertical-rl; transform: rotate(180deg); }
  td.win { background: #e3f1dc; }
  td.out { color: #888; }
  .error { color: #b00020; }
  .muted { color: #666; }
  details { margin: .5rem 0; } summary { cursor: pointer; }
  .wide { width: max-content; min-width: 100%; max-width: calc(100vw - 3rem); position: relative; left: 50%; transform: translateX(-50%); overflow-x: auto; }
</style>
</head>
<body>
<main id="app"></main>
<script src="tideman.js"></script>
<script src="app.js"></script>
</body>
</html>
